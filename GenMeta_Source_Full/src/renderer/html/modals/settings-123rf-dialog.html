<!-- 123RF Settings Dialog Modal -->
<div class="dialog-overlay" id="csv-123rf-settings-dialog">
  <div class="dialog" style="max-width: 400px">
    <!-- Dialog Header -->
    <div class="dialog-header">
      <div class="dialog-title">123RF Settings</div>
      <button class="dialog-close" id="close-123rf-settings">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Dialog Body -->
    <div class="dialog-body">
      <div class="form-group">
        <label for="csv-123rf-country">Country Code</label>
        <input
          type="text"
          id="csv-123rf-country"
          placeholder="e.g., US, UK, BD"
          maxlength="2"
          style="text-transform: uppercase"
        />
        <p class="setting-hint">
          <i class="fas fa-info-circle"></i>
          Enter a 2-letter country code (e.g., US, UK, BD). This will be prepended to titles in the 123RF CSV export.
        </p>
      </div>
    </div>

    <!-- Dialog Footer -->
    <div class="dialog-footer">
      <button class="btn secondary" id="cancel-123rf-settings">Cancel</button>
      <button class="btn primary" id="save-123rf-settings">Save</button>
    </div>
  </div>
</div>
