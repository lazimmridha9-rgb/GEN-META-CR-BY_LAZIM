<!-- iStock Settings Dialog Modal -->
<div class="dialog-overlay" id="csv-istock-settings-dialog">
  <div class="dialog" style="max-width: 400px">
    <!-- Dialog Header -->
    <div class="dialog-header">
      <div class="dialog-title">iStock Settings</div>
      <button class="dialog-close" id="close-istock-settings">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Dialog Body -->
    <div class="dialog-body">
      <div class="form-group">
        <label class="toggle">
          <input type="checkbox" id="csv-istock-editorial" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">Editorial</span>
        </label>
        <p class="setting-hint">
          <i class="fas fa-info-circle"></i>
          Enable this if your content is editorial.
        </p>
      </div>

      <div class="form-group">
        <label for="csv-istock-artist-name">Artist Name</label>
        <input type="text" id="csv-istock-artist-name" placeholder="Your Artist Name" />
        <p class="setting-hint">
          <i class="fas fa-info-circle"></i>
          Enter your artist name for iStock CSV export.
        </p>
      </div>
    </div>

    <!-- Dialog Footer -->
    <div class="dialog-footer">
      <button class="btn secondary" id="cancel-istock-settings">Cancel</button>
      <button class="btn primary" id="save-istock-settings">Save</button>
    </div>
  </div>
</div>
