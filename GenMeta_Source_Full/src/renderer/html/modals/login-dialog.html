<!-- Login Dialog Modal -->
<div class="dialog-overlay" id="login-dialog">
  <div class="dialog login-dialog">
    <!-- Dialog Header -->
    <div class="dialog-header">
      <div class="dialog-title">Welcome to GenMeta</div>
    </div>

    <!-- Dialog Body -->
    <div class="dialog-body">
      <div class="login-container">
        <!-- Login Header -->
        <div class="login-header">
          <h2>Sign In</h2>
          <p class="login-subtitle">Access your Premium account to generate unlimited metadata</p>
        </div>

        <!-- Social Login -->
        <div class="social-login">
          <button class="btn google-login" id="google-login-btn">
            <img src="./assets/icons/google.svg" alt="Google" class="google-icon" />
            <span>Continue with Google</span>
          </button>
          <button class="btn guest-login" id="guest-login-btn">
            <i class="fas fa-user-secret"></i>
            <span>Login as Guest</span>
          </button>
        </div>

        <div class="login-divider">
          <span>OR</span>
        </div>

        <!-- Login Form -->
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <div class="input-with-icon login-input-container">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="login-email" placeholder="Enter your email address" required />
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-with-icon login-input-container">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="login-password" placeholder="Enter your password" required />
              <button type="button" class="toggle-password" id="toggle-login-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="login-actions">
            <button type="submit" class="btn primary login-btn" id="login-btn">Sign In</button>
          </div>

          <div class="login-links">
            <a href="#" id="forgot-password-link" class="login-link">Forgot password?</a>
            <a href="#" id="create-account-link" class="login-link">Create account</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
