<!-- API Key Modal -->
<div class="dialog-overlay" id="api-key-modal">
  <div class="dialog" style="max-width: 500px">
    <!-- Dialog Header -->
    <div class="dialog-header">
      <div class="dialog-title" id="api-key-modal-title">Add API Key</div>
      <button class="dialog-close" id="close-api-key-modal">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Dialog Body -->
    <div class="dialog-body">
      <div class="form-group">
        <label for="api-key-input">Gemini API Key</label>
        <div class="input-with-icon">
          <input type="password" id="api-key-input" placeholder="Enter your Gemini API key" />
          <button type="button" class="toggle-password" id="toggle-api-key-input">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <p class="setting-hint" style="margin-top: 10px">
          <i class="fas fa-info-circle"></i>
          Your API key will be stored securely and used for generating metadata.
        </p>
      </div>
    </div>

    <!-- Dialog Footer -->
    <div class="dialog-footer">
      <button type="button" class="btn secondary" id="cancel-api-key-btn">Cancel</button>
      <button type="button" class="btn primary" id="save-api-key-btn">
        <i class="fas fa-save"></i>
        Save
      </button>
    </div>
  </div>
</div>
