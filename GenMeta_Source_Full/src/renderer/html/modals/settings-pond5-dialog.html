<!-- Pond5 Settings Dialog Modal -->
<div class="dialog-overlay" id="csv-pond5-settings-dialog">
  <div class="dialog" style="max-width: 400px">
    <!-- Dialog Header -->
    <div class="dialog-header">
      <div class="dialog-title">Pond5 Settings</div>
      <button class="dialog-close" id="close-pond5-settings">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Dialog Body -->
    <div class="dialog-body">
      <div class="form-group">
        <label class="toggle">
          <input type="checkbox" id="csv-pond5-editorial" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">Editorial</span>
        </label>
        <p class="setting-hint">
          <i class="fas fa-info-circle"></i>
          Enable this if your content is editorial. Editorial content will be marked accordingly in the Pond5 CSV export.
        </p>
      </div>
    </div>

    <!-- Dialog Footer -->
    <div class="dialog-footer">
      <button class="btn secondary" id="cancel-pond5-settings">Cancel</button>
      <button class="btn primary" id="save-pond5-settings">Save</button>
    </div>
  </div>
</div>
