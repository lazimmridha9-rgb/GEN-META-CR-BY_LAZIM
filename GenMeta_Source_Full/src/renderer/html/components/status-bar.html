<!-- Status Bar Component -->
<div class="status-bar">
  <div class="status-item">
    <i class="fas fa-circle-info"></i>
    Status: <span id="api-status">Active</span>
  </div>

  <div class="status-item">
    <i class="fas fa-crown" style="color: #ffd700"></i>
    Plan: <span id="api-plan">Premium</span>
  </div>

  <div class="status-item" id="credit-status">
    <i class="fas fa-infinity"></i>
    Credits: <span id="api-credits">Unlimited</span>
  </div>

  <div class="status-item" id="expiry-status" style="display: none">
    <i class="fas fa-calendar-alt"></i>
    Expires: <span id="api-expires">N/A</span>
  </div>

  <div style="flex: 1"></div>

  <div class="status-item" style="color: #3b82f6; font-weight: bold; background: rgba(59, 130, 246, 0.1); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(59, 130, 246, 0.2); margin-right: 15px;">
    <i class="fas fa-user-secret" style="margin-right: 5px; opacity: 1;"></i>
    <span>Engineered by Lazim Mridha</span>
  </div>

  <div class="status-item">
    <i class="fas fa-code-branch"></i>
    Version: <span id="app-version">loading...</span>
  </div>

  <div class="status-item upgrade-container" id="upgrade-btn-container" style="display: none">
    <button class="btn primary btn-sm" id="upgrade-btn" style="height: 24px">
      <i class="fas fa-crown"></i>
      Upgrade
    </button>
  </div>

  <div class="status-item refer-container">
    <button class="btn secondary btn-sm" id="refer-btn" style="height: 24px">
      <i class="fas fa-share-alt"></i>
      Refer
    </button>
  </div>
</div>
