<!doctype html>
<html lang="en">
  <head>

    <title>GenMeta</title>

    <!-- External stylesheets -->

  </head>

      <div id="__partial-navbar"></div>

      <div class="main-content">

          <div id="__partial-initial-state"></div>

    <div id="__partial-login-dialog"></div>
    <div id="__partial-api-validation-dialog"></div>
    <div id="__partial-rename-files-dialog"></div>
    <div id="__partial-gs-manual-install-modal"></div>
    <div id="__partial-profile-dropdown"></div>
    <div id="__partial-api-key-modal"></div>
    <div id="__partial-docs-panel"></div>

    <!-- Application scripts -->
    <script src="./utils/html-loader.js"></script>
    <script src="./resource/js/settings-sync.js"></script>
    <script src="./resource/js/script.js"></script>
    <script src="./resource/js/custom-dropdown.js"></script>
    <script src="./resource/js/ghostscript-installer.js"></script>
    <script src="./resource/js/api-key-manager.js"></script>
    <script src="./resource/js/important-notes.js"></script>

</html>
