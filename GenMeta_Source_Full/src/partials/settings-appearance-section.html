<!-- Settings: Appearance Section -->
<h4 class="settings-section-title">
  <i class="fas fa-palette"></i>
  Appearance
</h4>

<div class="form-group">
  <label class="toggle">
    <input type="checkbox" id="settings-dark-mode" />
    <span class="toggle-slider"></span>
    <span class="toggle-label">Dark Mode</span>
  </label>
  <p class="setting-hint">Toggle between dark and light theme for the application</p>
</div>

<div class="form-group">
  <label class="toggle">
    <input type="checkbox" id="settings-enable-notifications" checked />
    <span class="toggle-slider"></span>
    <span class="toggle-label">Desktop Notifications</span>
  </label>
  <p class="setting-hint">Show desktop notifications when processing completes and the app is not focused</p>
</div>
