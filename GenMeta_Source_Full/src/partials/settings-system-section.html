<!-- Settings: System/API Configuration Section -->
<div class="form-group">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h5 class="settings-subsection-title">
      <i class="fas fa-key"></i>
      API Configuration
    </h5>
  </div>
</div>

<!-- Gemini API Keys -->
<div class="form-group" id="gemini-api-key-group">
  <label>Gemini API Keys</label>
  <div style="display: flex; gap: 10px; margin-bottom: 15px">
    <button type="button" class="btn primary btn-sm" id="add-api-key-btn" style="flex: 1">
      <i class="fas fa-plus"></i>
      Add API Key
    </button>
    <button type="button" class="btn secondary btn-sm" id="get-api-key-btn" title="Get a Gemini API key from Google AI Studio">
      <i class="fas fa-external-link-alt"></i>
      Get API Key
    </button>
  </div>

  <!-- API Keys List -->
  <div id="api-keys-list" class="api-keys-list">
    <div class="api-keys-empty" id="api-keys-empty">
      <i class="fas fa-key" style="font-size: 24px; opacity: 0.3; margin-bottom: 10px;"></i>
      <p style="margin: 0; opacity: 0.6">No API keys added yet</p>
    </div>
  </div>

  <p class="setting-hint">
    <i class="fas fa-info-circle"></i>
    You can add unlimited Gemini API keys. The system will automatically rotate between them to
    <strong style="color: antiquewhite">avoid quota limits</strong>. At least one API key is required.
  </p>
</div>

<div class="form-group" id="ai-api-key-group" style="display: none"></div>

<!-- Premium Toggle (Hidden) -->
<div class="form-group" style="display: none">
  <label class="toggle">
    <input type="checkbox" id="settings-is-premium" />
    <span class="toggle-slider"></span>
    <span class="toggle-label">Premium Gemini Api</span>
  </label>
  <p class="setting-hint">Premium Gemini Api allows processing up to 10x faster</p>
</div>
