<!-- Profile Dropdown Component -->
<div class="profile-dropdown" id="profile-dropdown">
  <div class="profile-dropdown-content">
    <!-- Profile Header -->
    <div class="profile-header">
      <div class="profile-avatar">
        <i class="fas fa-user-circle"></i>
      </div>
      <div class="profile-info">
        <div class="profile-name" id="profile-name">Loading...</div>
        <div class="profile-email" id="profile-email">Loading...</div>
      </div>
    </div>

    <div class="profile-divider"></div>

    <!-- Profile Details -->
    <div class="profile-details">
      <div class="profile-detail-item">
        <i class="fas fa-crown" style="color: #ffd700; margin-right: 8px"></i>
        <div class="profile-detail-label">Plan</div>
        <div class="profile-detail-value" id="profile-plan">Premium</div>
      </div>

      <div class="profile-detail-item" id="profile-expiry-item" style="display: none">
        <div class="profile-detail-label">Expires</div>
        <div class="profile-detail-value" id="profile-expiry">N/A</div>
      </div>

      <div class="profile-detail-item" id="profile-credits-item" style="display: none">
        <div class="profile-detail-label">Credits</div>
        <div class="profile-detail-value" id="profile-credits">Unlimited</div>
      </div>
    </div>

    <div class="profile-divider"></div>

    <!-- Profile Footer -->
    <div class="profile-footer">
      <button class="btn secondary warning" id="logout-btn">Logout</button>
    </div>
  </div>
</div>
