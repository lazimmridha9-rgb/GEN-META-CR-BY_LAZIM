<!-- Navbar Component -->
<div class="top-navbar">
  <!-- Directory Selection -->
  <div class="directory-selection">
    <button type="button" id="clear-state-btn" class="btn secondary hidden" title="Clear current selection and start over">
      <i class="fa-solid fa-arrow-left"></i>
      Home
    </button>

    <div id="image-count" class="btn secondary" style="margin-right: -5px; border: none" title="Number of files ready for processing">
      0 Files
    </div>

    <div id="selected-path" class="path-display" title="Current selection path">
      No Selection
    </div>
  </div>

  <!-- Navbar Actions -->
  <div class="navbar-actions">
    <button id="regenerate-btn" class="btn primary hidden" title="">
      <i class="fas fa-bolt"></i>
      Regenerate
    </button>

    <button id="stop-btn" class="btn warning" disabled title="Stop the current generation process">
      <i class="fas fa-stop"></i>
    </button>

    <button id="retry-failed-btn" class="btn secondary hidden" title="Retry all failed items">
      <i class="fas fa-redo"></i>
      Retry Failed
    </button>

    <button id="settings-btn" class="btn secondary navbar-btn" title="Open application settings and preferences">
      <i class="fas fa-cog"></i>
      Settings
    </button>

    <button id="help-btn" class="btn secondary navbar-btn" title="Get help and view documentation">
      <i class="fas fa-question-circle"></i>
      Help
    </button>

    <button id="profile-btn" class="btn secondary navbar-btn" title="View your account and subscription details">
      <i class="fas fa-user-circle"></i>
      Account
    </button>

    <button type="button" id="important-notes-btn" class="important-notes-btn">
      <span class="btn-icon-wrapper">
        <i class="fas fa-exclamation-circle"></i>
      </span>
      <span class="btn-text"> Notice</span>
      <span class="btn-pulse"></span>
    </button>
  </div>
</div>
