<!-- Settings Dialog Modal -->
<div class="dialog-overlay" id="settings-dialog">
  <div class="dialog settings-dialog">
    <!-- Dialog Header -->
    <div class="dialog-header">
      <div class="dialog-title">Settings</div>
      <button class="dialog-close" id="close-settings">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Dialog Body -->
    <div class="dialog-body settings-container">
      <!-- Settings Sidebar -->
      <div class="settings-sidebar">
        <ul class="settings-menu">
          <li class="settings-menu-item active" data-section="ai-section">
            <i class="fas fa-sliders-h"></i>
            AI Parameters
          </li>
          <li class="settings-menu-item" data-section="system-section">
            <i class="fas fa-tools"></i>
            API Configuration
          </li>
          <li class="settings-menu-item hidden" data-section="advanced-section">
            <i class="fas fa-cogs"></i>
            Advanced
          </li>
          <li class="settings-menu-item" data-section="csv-section">
            <i class="fas fa-file-csv"></i>
            CSV Export
          </li>
          <li class="settings-menu-item" data-section="appearance-section">
            <i class="fas fa-palette"></i>
            Appearance
          </li>
        </ul>
      </div>

      <!-- Settings Content -->
      <div class="settings-content">
        <form id="settings-form">
          <div class="settings-section" id="system-section">
            <div id="__partial-settings-system-section"></div>
          </div>

          <div class="settings-section active" id="ai-section">
            <div id="__partial-settings-ai-section"></div>
          </div>

          <div class="settings-section" id="advanced-section">
            <div id="__partial-settings-advanced-section"></div>
          </div>

          <div class="settings-section" id="csv-section">
            <div id="__partial-settings-csv-section"></div>
          </div>

          <div class="settings-section" id="appearance-section">
            <div id="__partial-settings-appearance-section"></div>
          </div>
        </form>
      </div>
    </div>

    <!-- Dialog Footer -->
    <div class="dialog-footer">
      <button class="btn secondary" id="cancel-settings">Cancel</button>
      <button class="btn primary" id="save-settings">Save Changes</button>
    </div>
  </div>
</div>
